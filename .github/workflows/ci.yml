name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # compatibility: the minimum the manifest claims, and the version we
        # actually develop against. Both have to lint, so a newer shell cannot
        # quietly break a plugin that still says requires_dms ">=2.1.0".
        shell: ${{ fromJSON(vars.DUX_SHELL_MATRIX || '["v2.1.0", "v2.1.2"]') }}
    steps:
      - uses: actions/checkout@v4

      # qmllint resolves `import qs.*` against the shell's own modules, so the
      # plugin is linted against a real checkout rather than a stub.
      - name: Clone dux-shell (for qs.* imports)
        uses: actions/checkout@v4
        with:
          repository: duxlabs-dev/dux-shell
          path: .dux-shell
          ref: ${{ matrix.shell }}

      - name: Install qmllint, qmltestrunner and shellcheck
        run: |
          sudo apt-get update -qq
          # qml6-module-qttest provides the QtTest QML module the tests import;
          # without it qmltestrunner fails with "Type TestCase unavailable"
          sudo apt-get install -y -qq qt6-declarative-dev-tools qml6-module-qttest shellcheck python3
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Run the same checks as locally
        env:
          DUX_SHELL_DIR: ${{ github.workspace }}/.dux-shell
          QML_IMPORT_DIR: /usr/lib/qt6/qml
        run: ./scripts/ci.sh

      # The registry's own validators live in the registry repo and check live
      # URLs, which only exist after the first push, so they stay in the
      # publishing runbook instead of here.
      - name: Reminder of what CI cannot cover
        run: |
          echo "Not covered here: niri behaviour, the clipboard handoff, the dash UI."
          echo "Those need a compositor and a running shell; see bench/ and README."
