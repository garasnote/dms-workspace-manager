name: release

# Tag a commit as v1.0.0 and push: the tag has to match plugin.json's version,
# the checks have to pass, and the installable zip is attached to the release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and manifest versions must agree
        id: version
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "plugin.json: $version, tag: $tag"
            if [ "$version" != "$tag" ]; then
              echo "::error::plugin.json version ($version) does not match tag ($tag)"
              exit 1
            fi
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            # semver prerelease = a hyphen in the tag (v0.1.0-alpha.1)
            case "$GITHUB_REF_NAME" in
              *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;;
              *)   echo "prerelease=" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            # workflow_dispatch: no tag to compare against, use the manifest's
            # version for the artifact name
            echo "manual run: packaging v$version"
            echo "label=v$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone dux-shell (for qs.* imports)
        uses: actions/checkout@v4
        with:
          repository: duxlabs-dev/dux-shell
          path: .dux-shell
          ref: ${{ vars.DUX_SHELL_REF || 'v2.1.2' }}

      - name: Install qmllint and shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools shellcheck python3
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Checks before anything is published
        env:
          DUX_SHELL_DIR: ${{ github.workspace }}/.dux-shell
        run: ./scripts/ci.sh

      - name: Pack the installable files
        id: pack
        run: |
          set -euo pipefail
          name="niri-workspace-manager-${{ steps.version.outputs.label }}"
          mkdir -p "dist/$name"
          # exactly what DMS needs to load the plugin: no bench, no graph, no CI
          cp plugin.json templates.json README.md LICENSE ./*.qml "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          echo "zip=dist/$name.zip" >> "$GITHUB_OUTPUT"
          echo "sha=dist/$name.zip.sha256" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.label }}" \
            ${{ steps.version.outputs.prerelease }} \
            --title "${{ steps.version.outputs.label }}" \
            --notes "Installable plugin archive (plugin.json, templates.json, *.qml, README, LICENSE) plus a SHA-256. DMS installs from the repo directly, so this archive is for manual or pinned installs." \
            "${{ steps.pack.outputs.zip }}" "${{ steps.pack.outputs.sha }}"
